<title>João Gaspar Running Stats</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--ink2:#4b5361;--line:#d5dae2;--navy:#101b2d;--red:#d9301f;--err:#c42a1b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c111a;--card:#131a26;--ink:#eef1f6;--ink2:#bcc4d1;--line:#36435a;--err:#ff6a55;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.top{background:var(--navy);color:#f3f5f8;padding:20px 22px;position:relative}
.top::after{content:"";position:absolute;right:0;top:0;bottom:0;width:54px;background:var(--red);clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
h1{margin:0;font-size:1.9rem;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.who{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#aab4c4;margin-top:4px;font-weight:600}
form{padding:20px 22px 22px;display:grid;gap:12px}
label{font-size:.9rem;color:var(--ink2)}
input{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px;width:100%}
button{font:inherit;font-weight:700;font-size:.95rem;padding:11px 14px;border:0;background:var(--navy);color:#f3f5f8;cursor:pointer;border-radius:2px}
@media (prefers-color-scheme:dark){button{background:#2a3b58}}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.msg{min-height:1.2em;font-size:.88rem;color:var(--ink2);margin:0}
.msg.err{color:var(--err)}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(E.salt), iterations: E.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return new TextDecoder().decode(pt);
}
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
if (!(window.crypto && crypto.subtle)) { msg.className = "msg err"; msg.textContent = "Este navegador não permite abrir o painel. Abre o endereço com https num navegador atualizado."; go.disabled = true; }
f.addEventListener("submit", async e => {
  e.preventDefault(); go.disabled = true; msg.className = "msg"; msg.textContent = "A abrir…";
  let html;
  try { html = await abrir(document.getElementById("pw").value); }
  catch (err) { msg.className = "msg err"; msg.textContent = "Palavra-passe errada. Tenta de novo."; go.disabled = false; document.getElementById("pw").select(); return; }
  document.open(); document.write(html); document.close();
});
